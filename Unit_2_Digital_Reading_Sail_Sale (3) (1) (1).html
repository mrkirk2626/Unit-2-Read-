<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 3 Unit 2 Reading Assessment</title><style>:root{font-family:Arial,sans-serif;color:#182b42;background:#edf3f9}*{box-sizing:border-box}body{margin:0}header{background:#173d70;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}header h1{font-size:21px;margin:0}header small{color:#d8e8fc}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;height:calc(100vh - 78px)}section{background:white;border-radius:12px;overflow:auto;padding:24px;box-shadow:0 2px 8px #0001}h2{color:#173d70;margin-top:0}.para{font-family:Georgia,serif;font-size:19px;line-height:1.75;margin:18px 0}.num{color:#426ca0;font:bold 14px Arial;margin-right:9px}#question{font-size:21px;line-height:1.5;font-weight:700}.option{display:block;border:2px solid #d4dfed;border-radius:10px;padding:14px;margin:12px 0;cursor:pointer;font-size:17px;line-height:1.4}.option:has(input:checked){border-color:#2769c1;background:#e9f2ff}.option input{margin-right:12px;transform:scale(1.2)}button{border:0;border-radius:9px;background:#215da7;color:white;font-size:16px;font-weight:bold;padding:13px 19px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e5edf8;color:#174478}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:25px}.hint{color:#586a81;font-size:14px}.tag{display:inline-block;background:#e8f0fb;color:#285a9c;border-radius:30px;padding:7px 12px;font-weight:bold;font-size:13px}.result{padding:28px;max-width:800px;margin:25px auto;background:white;border-radius:16px}.score{font-size:55px;color:#174b8c;font-weight:800}.review{padding:13px;border-bottom:1px solid #ddd}.good{color:#13784b}.bad{color:#b33d3d}@media(max-width:700px){.layout{grid-template-columns:1fr;height:auto}section{max-height:65vh}header{display:block}}</style></head><body><header><div><h1>Grade 3 • Unit 2 Reading Assessment</h1><small>Read carefully. Use the passage to support your answers.</small></div><strong id="progress">Question 1 of 10</strong></header><main id="main" class="layout"><section id="reading"></section><section id="work"><span class="tag" id="genre"></span><p id="question"></p><p class="hint" id="instruction"></p><div id="options"></div><div class="nav"><button class="secondary" id="prev" onclick="move(-1)">← Previous</button><button id="next" onclick="move(1)">Next →</button></div><p class="hint" id="notice">Answers are not graded until you submit.</p></section></main><script>
const passages=[{title:'The Girl Who Borrowed the Wind',genre:'An Original Greek-Style Myth',paragraphs:[
'Long ago, in a village beside the sea, a girl named Thalia watched her father repair fishing boats. For many days, the air had been still. Without wind, the boats could not sail, and the villagers worried that their food would soon run out.',
'Thalia climbed the rocky hill above the harbor to ask Aeolus, keeper of the winds, for help. She found a silver jar resting beside an ancient olive tree. A voice from the clouds said, “Inside this jar sleeps the west wind. Open it only when you reach the harbor.”',
'Thalia promised to obey. As she hurried downhill, the jar hummed softly. She was eager to see the boats sail again. She quickened her steps and held the jar close, even when the path grew steep.',
'Halfway home, Thalia heard the villagers calling from below. She thought, “If I open the jar now, they will see that I have saved them.” Her pride grew like a rising wave. Before she reached the harbor, she lifted the lid.',
'The wind burst out with a mighty roar. It shook the olive trees and sent dust spinning across the hillside. Down below, loose sails snapped, and an empty fishing boat broke free from its rope. Thalia struggled to close the jar, but the wind had escaped.',
'“I wanted everyone to know I helped,” Thalia whispered. She ran to the harbor, where her father and the other villagers were securing their boats. Instead of hiding, she told them what she had done and helped pull the loose boat back to shore.',
'Aeolus appeared in a swirl of pale clouds. “The wind is a gift,” he said, “but a gift must be used with care.” He calmed the gusts and sent a steady breeze across the water. Thalia waited until the boats were ready before helping raise their sails. From then on, she learned that doing the right thing mattered more than receiving praise.'
]},{title:'The Fox and the Patient Turtle',genre:'An Original Aesop-Style Fable',paragraphs:[
'One dry afternoon, Fox and Turtle discovered a small apple tree beside a narrow stream. Several red apples hung from its highest branches. Fox leaped again and again, but the fruit remained beyond his reach.',
'“This tree is playing tricks on me!” Fox complained. Turtle studied the branches and noticed a fallen log nearby. “We could roll that log beneath the tree,” Turtle suggested. “Then you might reach an apple.”',
'Fox laughed. “By the time you move that log, the sun will have gone to sleep!” He raced around the tree, jumping higher each time. Soon his legs ached, and his stomach growled.',
'Turtle slowly pushed the log across the grass. Fox watched from the shade, too tired to help. At last, Turtle stopped beneath the lowest branch. “Now we have a place to stand,” Turtle said.',
'Fox climbed onto the log and picked two apples. He started to eat both, but then noticed Turtle resting beside the stream. Fox climbed down and offered one apple to his friend.',
'“I thought moving slowly meant wasting time,” Fox admitted. “But your careful plan worked better than all my jumping.” Turtle smiled. “A little patience can take you a long way.” They shared the apples in the cool shade.'
]}];
const qs=[
{p:0,skill:'Important Details',type:'multi',ask:'Which TWO details from paragraphs 2–3 best show that Thalia intends to follow Aeolus’s instructions?',opts:['She promises to obey Aeolus.','The jar rests beside an olive tree.','She holds the jar close while hurrying toward the harbor.','The village is beside the sea.'],ans:[0,2],why:'Her promise and careful trip toward the harbor show that she initially plans to follow the instructions.'},
{p:0,skill:'Context Clues',type:'single',ask:'What does the word eager mean as it is used in paragraph 3?',opts:['afraid of making a mistake','excited for something to happen','too tired to continue','uncertain which path to take'],ans:[1],why:'Thalia quickens her steps because she is excited to see the boats sail again.'},
{p:0,skill:'Homophones',type:'single',ask:'Which sentence correctly uses the word sail?',opts:['The villagers waited for the boats to go on sail.','Thalia helped raise the sail before the boats left the harbor.','The fisherman hoped to sail his fish at the market.','The shop held a big sail on fishing nets.'],ans:[1],why:'Sail refers to the cloth on a boat that catches the wind. Sale refers to selling something. Thalia helped raise the sail.'},
{p:0,skill:'Literal and Nonliteral Language',type:'single',ask:'Read this sentence from paragraph 4: “Her pride grew like a rising wave.” What does this comparison help the reader understand?',opts:['Thalia is becoming more pleased with herself.','A wave is moving toward Thalia on the hill.','Thalia is afraid the sea will flood the village.','The wind is already blowing across the harbor.'],ans:[0],why:'The comparison is nonliteral. It shows Thalia’s growing pride, not an actual wave.'},
{p:0,skill:'Character and Plot',type:'single',ask:'Which character trait most directly causes Thalia to open the jar too soon?',opts:['her patience','her pride','her honesty','her kindness'],ans:[1],why:'Thalia opens the jar early because she wants the villagers to see her as a hero.'},
{p:0,skill:'Resolution',type:'multi',ask:'Which TWO events belong in a recounting of the resolution of the myth?',opts:['Thalia asks Aeolus for help on the hill.','Thalia admits what she did and helps secure the boats.','Thalia opens the jar before reaching the harbor.','Aeolus calms the wind and sends a steady breeze.'],ans:[1,3],why:'The resolution includes Thalia taking responsibility and Aeolus restoring safe wind for the boats.'},
{p:1,skill:'Setting and Plot',type:'single',ask:'How does the setting beside the apple tree affect what happens in the fable?',opts:['The stream prevents the animals from sharing the fruit.','The high branches create a problem the animals must solve.','The shade makes Turtle forget about the apples.','The dry afternoon causes the apples to fall.'],ans:[1],why:'Because the apples are too high, Fox and Turtle must find a way to reach them.'},
{p:1,skill:'Figurative Language',type:'single',ask:'In paragraph 3, Fox says, “the sun will have gone to sleep.” What does Fox mean?',opts:['The sun will stop shining forever.','Turtle will fall asleep in the grass.','It will be nighttime before Turtle finishes.','The tree will become too dark to see.'],ans:[2],why:'Fox uses a nonliteral expression to suggest that Turtle is taking a very long time.'},
{p:1,skill:'Literal vs. Nonliteral',type:'multi',ask:'Which TWO sentences from the fable use nonliteral language?',opts:['“This tree is playing tricks on me!”','“Turtle slowly pushed the log across the grass.”','“Soon his legs ached, and his stomach growled.”','“A little patience can take you a long way.”'],ans:[0,3],why:'A tree cannot deliberately play tricks, and patience does not literally carry someone a distance. Both expressions are nonliteral.'},
{p:1,skill:'Moral and Character',type:'single',ask:'Which lesson is best supported by Fox’s actions at the end of the fable?',opts:['Working quickly always leads to success.','A clever plan and patience can solve a problem.','It is better to work alone than with a friend.','Sharing is only important when food is plentiful.'],ans:[1],why:'Fox learns that Turtle’s patient plan works better than his repeated jumping.'}
];
let at=0,answers=Array(qs.length).fill(null),done=false;
function render(){let q=qs[at],p=passages[q.p];document.getElementById('progress').textContent=`Question ${at+1} of 10`;document.getElementById('genre').textContent=`${q.p?'Fable':'Myth'} • Question ${at+1}`;document.getElementById('reading').innerHTML=`<span class="tag">${p.genre}</span><h2>${p.title}</h2>`+p.paragraphs.map((t,i)=>`<p class="para"><span class="num">${i+1}</span>${t}</p>`).join('');document.getElementById('question').textContent=`${at+1}. ${q.ask}`;document.getElementById('instruction').textContent=q.type==='multi'?'Select TWO answers.':'Select ONE answer.';document.getElementById('options').innerHTML=q.opts.map((o,i)=>`<label class="option"><input type="${q.type==='multi'?'checkbox':'radio'}" name="q" value="${i}" ${answers[at]?.includes(i)?'checked':''} onchange="choose(${i})"><b>${'ABCD'[i]}.</b> ${o}</label>`).join('');document.getElementById('prev').disabled=at===0;document.getElementById('next').textContent=at===9?'Submit Assessment':'Next →';}
function choose(i){let q=qs[at],v=answers[at]||[];if(q.type==='single')v=[i];else if(v.includes(i))v=v.filter(x=>x!==i);else if(v.length<2)v=[...v,i];else {alert('Select only TWO answers.');render();return}answers[at]=v;renderOptionsOnly()}
function renderOptionsOnly(){document.querySelectorAll('#options input').forEach(e=>e.checked=answers[at]?.includes(Number(e.value))||false)}
function move(delta){if(delta===1&&at===9){submit();return}at+=delta;render();document.getElementById('work').scrollTop=0;document.getElementById('reading').scrollTop=0}
function submit(){let missing=answers.map((v,i)=>v?.length===qs[i].ans.length?-1:i).filter(i=>i>=0);if(missing.length){if(confirm(`You have ${missing.length} unanswered or incomplete question(s). Go to the first one?`)){at=missing[0];render()}return}if(!confirm('Submit your answers for scoring? You cannot change them afterward.'))return;let correct=qs.map((q,i)=>JSON.stringify([...answers[i]].sort())===JSON.stringify([...q.ans].sort()));let score=correct.filter(Boolean).length;let groups=[['Myth',0,6],['Fable',6,10]];document.querySelector('header').innerHTML='<h1>Grade 3 • Unit 2 Reading Assessment — Results</h1>';document.getElementById('main').className='result';document.getElementById('main').innerHTML=`<h2>Assessment Complete</h2><div class="score">${score} / 10</div><h2>${score*10}%</h2><p>Show this screen to your teacher.</p><h3>Passage Scores</h3>${groups.map(([name,a,b])=>`<p><b>${name}:</b> ${correct.slice(a,b).filter(Boolean).length} / ${b-a}</p>`).join('')}<h3>Skill Results</h3>${qs.map((q,i)=>`<p>${correct[i]?'✓':'✗'} Question ${i+1} — ${q.skill}: <b class="${correct[i]?'good':'bad'}">${correct[i]?'Correct':'Review'}</b></p>`).join('')}<button onclick="document.getElementById('details').hidden=false;this.hidden=true">Review Answers and Explanations</button><button class="secondary" onclick="window.print()">Print Results</button><div id="details" hidden><h2>Answer Review</h2>${qs.map((q,i)=>`<div class="review"><b>Question ${i+1}: ${q.skill}</b><p>${q.ask}</p><p>Your answer: ${(answers[i]||[]).map(j=>'ABCD'[j]).join(', ')}</p><p>Correct answer: ${q.ans.map(j=>'ABCD'[j]).join(', ')}</p><p>${q.why}</p></div>`).join('')}</div>`}
render();
</script></body></html>
